# 4G heap, not 8G: with the Firebase plugins an 8G ceiling plus the emulator and
# Android Studio ran a 16 GB machine out of memory and killed the daemon.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# The Kotlin compiler runs in its own daemon. Left alone it inherits the Gradle
# heap, so one build could hold two large JVMs at once.
kotlin.daemon.jvmargs=-Xmx2G
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Plugin sources live on a different drive root than the project (C:\Users\...\
# Pub\Cache vs D:\VSCODE\...), which breaks Kotlin's incremental caches when
# they cross drives. Disabling it forces full rebuilds but avoids the failure.
kotlin.incremental=false
